spring:
  application:
    name: ufam-planner-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ufam_planner}
    username: ${SPRING_DATASOURCE_USERNAME:ufam_planner}
    password: ${SPRING_DATASOURCE_PASSWORD:ufam_planner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:nao-responda@ufamplanner.local}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    access-token-minutes: 15
    refresh-token-days: 7
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:false}
  integrations:
    ufam:
      ecampus-base-url: ${UFAM_ECAMPUS_BASE_URL:https://ecampus.ufam.edu.br/ecampus}
      catalog-auto-sync-enabled: ${UFAM_CATALOG_AUTO_SYNC_ENABLED:true}
      catalog-sync-delay-ms: ${UFAM_CATALOG_SYNC_DELAY_MS:900000}
      catalog-sync-batch-size: ${UFAM_CATALOG_SYNC_BATCH_SIZE:5}
